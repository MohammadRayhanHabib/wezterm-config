# ============================================================
# 🚀 Aesthetic Tmux Config — Nvim-Compatible (Backtick Prefix)
# ============================================================
# Prefix: ` (backtick) — press ` then your command key
# Literal backtick: press ` twice (``)
# Place at: ~/.tmux.conf
# ============================================================

# ── Prefix ─────────────────────────────────────────────────
unbind C-b
set -g prefix `
bind ` send-prefix

# ── Basics ─────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g status-interval 5

# ── Terminal & Colors ──────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ── Keybinds ───────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind X kill-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R 5
bind > swap-pane -D
bind < swap-pane -U
bind Space last-window
bind b break-pane

# ── Copy Mode (Vim-style) ──────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Nvim Integration ───────────────────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# ── Status Bar (TOP — avoids nvim statusline clash) ─────────
set -g status-position top
set -g status-style bg=default,fg=default
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 120

# ── Status Left: Session + Path ────────────────────────────
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold] 󰆍 #S #[fg=#cba6f7,bg=#313244,nobold]#[fg=#cdd6f4,bg=#313244] #{b:pane_current_path} #[fg=#313244,bg=default]"

# ── Window Status ──────────────────────────────────────────
set -g window-status-format "#[fg=#6c7086,bg=default] #I:#W#{?window_zoomed_flag, 󰊓,}"
set -g window-status-current-format "#[fg=#a6e3a1,bg=default,bold] #I:#W#{?window_zoomed_flag, 󰊓,}"
set -g window-status-separator "  "

# ── Status Right: Date · Time ──────────────────────────────
set -g status-right "#[fg=#313244,bg=default]#[fg=#cdd6f4,bg=#313244] %b %d #[fg=#45475a,bg=#313244]#[fg=#cdd6f4,bg=#45475a] %H:%M #[fg=#89b4fa,bg=#45475a]#[fg=#11111b,bg=#89b4fa,bold] 󰣇 "

# ── Pane Borders ───────────────────────────────────────────
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#cba6f7
set -g pane-border-lines single
set -g pane-border-status off

# ── Message / Command Line ─────────────────────────────────
set -g message-style bg=#313244,fg=#cdd6f4
set -g message-command-style bg=#313244,fg=#89b4fa

# ── Clock Mode ─────────────────────────────────────────────
setw -g clock-mode-colour #cba6f7
setw -g clock-mode-style 24

# ── Popup / Menu Styling ───────────────────────────────────
set -g popup-border-style fg=#45475a
set -g popup-border-lines rounded
set -g menu-style bg=#1e1e2e,fg=#cdd6f4
set -g menu-selected-style bg=#45475a,fg=#cdd6f4
set -g menu-border-style fg=#45475a

# ── Activity / Bell ────────────────────────────────────────
set -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none
setw -g window-status-activity-style fg=#f9e2af,bg=default
